<!-- Grid: Holy Grail Layout -->
<div class="demo-showcase">
  <p style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">header / nav main aside / footer</p>
  <div class="grid grid--layout-holy-grail grid--gap-4" style="min-height: 350px;">
    <div class="grid__area--header" style="background: var(--color-primary-500); color: white; padding: 16px 20px; border-radius: 8px;">
      <strong>Site Header</strong>
    </div>
    <div class="grid__area--nav" style="background: var(--color-primary-50); border: 1px solid var(--color-primary-200); padding: 16px; border-radius: 8px;">
      <strong style="color: var(--color-primary-700);">Nav</strong>
      <ul style="margin: 12px 0 0; padding-left: 16px; font-size: 13px; color: var(--color-primary-600);">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
      </ul>
    </div>
    <div class="grid__area--main" style="background: white; border: 1px solid var(--border-default); padding: 24px; border-radius: 8px;">
      <strong>Main Article</strong>
      <p style="margin: 8px 0 0; color: var(--text-secondary); font-size: 14px;">Primary content area that grows to fill available space.</p>
    </div>
    <div class="grid__area--aside" style="background: var(--color-accent-50); border: 1px solid var(--color-accent-200); padding: 16px; border-radius: 8px;">
      <strong style="color: var(--color-accent-700);">Aside</strong>
      <p style="margin: 8px 0 0; font-size: 12px; color: var(--color-accent-600);">Related content, ads, or widgets.</p>
    </div>
    <div class="grid__area--footer" style="background: var(--color-neutral-700); color: white; padding: 12px 20px; border-radius: 8px; font-size: 13px;">
      Site Footer
    </div>
  </div>
</div>
