<!-- Grid: Dashboard Layout (Template Areas) -->
<div class="demo-showcase">
  <p style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">header / widget1 widget2 widget3 sidebar / main sidebar / footer</p>
  <div class="grid grid--layout-dashboard grid--gap-4" style="min-height: 400px;">
    <div class="grid__area--header" style="background: linear-gradient(135deg, var(--color-primary-600), var(--color-secondary-600)); color: white; padding: 16px 20px; border-radius: 8px;">
      <strong>Header</strong> - Navigation & Logo
    </div>
    <div class="grid__area--widget1" style="background: var(--color-success-50); border: 1px solid var(--color-success-200); padding: 20px; border-radius: 8px;">
      <div style="font-size: 24px; font-weight: 700; color: var(--color-success-600);">$12,450</div>
      <div style="font-size: 12px; color: var(--color-success-700);">Revenue</div>
    </div>
    <div class="grid__area--widget2" style="background: var(--color-info-50); border: 1px solid var(--color-info-200); padding: 20px; border-radius: 8px;">
      <div style="font-size: 24px; font-weight: 700; color: var(--color-info-600);">1,234</div>
      <div style="font-size: 12px; color: var(--color-info-700);">Users</div>
    </div>
    <div class="grid__area--widget3" style="background: var(--color-secondary-50); border: 1px solid var(--color-secondary-200); padding: 20px; border-radius: 8px;">
      <div style="font-size: 24px; font-weight: 700; color: var(--color-secondary-600);">89%</div>
      <div style="font-size: 12px; color: var(--color-secondary-700);">Conversion</div>
    </div>
    <div class="grid__area--sidebar" style="background: var(--color-neutral-100); border: 1px solid var(--border-default); padding: 16px; border-radius: 8px;">
      <strong style="display: block; margin-bottom: 12px;">Sidebar</strong>
      <div style="font-size: 13px; color: var(--text-secondary);">
        <div style="padding: 8px 0; border-bottom: 1px solid var(--border-default);">Quick Actions</div>
        <div style="padding: 8px 0; border-bottom: 1px solid var(--border-default);">Recent Activity</div>
        <div style="padding: 8px 0;">Notifications</div>
      </div>
    </div>
    <div class="grid__area--main" style="background: white; border: 1px solid var(--border-default); padding: 24px; border-radius: 8px;">
      <strong>Main Content</strong>
      <p style="margin: 8px 0 0; color: var(--text-secondary); font-size: 14px;">Charts, tables, and primary content go here.</p>
    </div>
    <div class="grid__area--footer" style="background: var(--color-neutral-800); color: var(--color-neutral-300); padding: 12px 20px; border-radius: 8px; font-size: 13px;">
      Footer - Copyright 2024
    </div>
  </div>
</div>
