<!-- Grid: Page Layout with Sidebar -->
<div class="demo-showcase--full">
  <p style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">header / sidebar main / footer</p>
  <div class="grid grid--layout-page grid--gap-4" style="min-height: 300px;">
    <div class="grid__area--header" style="background: var(--color-neutral-900); color: white; padding: 14px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
      <strong>App Name</strong>
      <div style="display: flex; gap: 16px; font-size: 13px;">
        <span>Dashboard</span>
        <span>Settings</span>
        <span>Profile</span>
      </div>
    </div>
    <div class="grid__area--sidebar" style="background: var(--color-primary-50); border: 1px solid var(--color-primary-100); padding: 16px; border-radius: 8px;">
      <div style="font-weight: 600; color: var(--color-primary-700); margin-bottom: 12px;">Menu</div>
      <div style="font-size: 13px; color: var(--color-primary-600);">
        <div style="padding: 8px 12px; background: var(--color-primary-100); border-radius: 6px; margin-bottom: 4px;">Overview</div>
        <div style="padding: 8px 12px;">Analytics</div>
        <div style="padding: 8px 12px;">Reports</div>
        <div style="padding: 8px 12px;">Settings</div>
      </div>
    </div>
    <div class="grid__area--main" style="background: white; border: 1px solid var(--border-default); padding: 24px; border-radius: 8px;">
      <h4 style="margin: 0 0 8px;">Welcome Back!</h4>
      <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Your main content area. On mobile, the sidebar stacks above this.</p>
    </div>
    <div class="grid__area--footer" style="background: var(--color-neutral-100); border: 1px solid var(--border-default); padding: 12px 20px; border-radius: 8px; font-size: 12px; color: var(--text-secondary);">
      Copyright 2024 - All rights reserved
    </div>
  </div>
</div>
