<!-- Dropdown Menu Component Demo -->

<section class="demo-section">
  <h3>Basic Menu</h3>
  <div class="menu">
    <button class="menu__trigger">
      Options
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content">
      <button class="menu__item">Edit</button>
      <button class="menu__item">Duplicate</button>
      <button class="menu__item">Archive</button>
      <div class="menu__divider"></div>
      <button class="menu__item menu__item--danger">Delete</button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>With Icons</h3>
  <div class="menu">
    <button class="menu__trigger">
      Actions
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content">
      <button class="menu__item">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M12.1 1.9a1.5 1.5 0 012.1 2.1l-9 9-3 1 1-3 9-9z"/>
        </svg>
        <span class="menu__item-text">Edit</span>
      </button>
      <button class="menu__item">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 4v8h8V4H4zm1-1h6a1 1 0 011 1v8a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/>
        </svg>
        <span class="menu__item-text">Duplicate</span>
      </button>
      <button class="menu__item">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a1 1 0 011 1v5h5a1 1 0 110 2H9v5a1 1 0 11-2 0V9H2a1 1 0 110-2h5V2a1 1 0 011-1z"/>
        </svg>
        <span class="menu__item-text">Add to collection</span>
      </button>
      <div class="menu__divider"></div>
      <button class="menu__item menu__item--danger">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M5.5 5.5v6m2.5-6v6m2.5-6v6M3 3.5h10l-.5 10a1 1 0 01-1 1H4.5a1 1 0 01-1-1L3 3.5z"/>
        </svg>
        <span class="menu__item-text">Delete</span>
      </button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>With Keyboard Shortcuts</h3>
  <div class="menu">
    <button class="menu__trigger">
      File
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content menu__content--lg">
      <button class="menu__item">
        <span class="menu__item-text">New File</span>
        <span class="menu__item-shortcut">Cmd+N</span>
      </button>
      <button class="menu__item">
        <span class="menu__item-text">Open...</span>
        <span class="menu__item-shortcut">Cmd+O</span>
      </button>
      <button class="menu__item">
        <span class="menu__item-text">Save</span>
        <span class="menu__item-shortcut">Cmd+S</span>
      </button>
      <button class="menu__item">
        <span class="menu__item-text">Save As...</span>
        <span class="menu__item-shortcut">Cmd+Shift+S</span>
      </button>
      <div class="menu__divider"></div>
      <button class="menu__item">
        <span class="menu__item-text">Export</span>
        <span class="menu__item-shortcut">Cmd+E</span>
      </button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>With Headers/Groups</h3>
  <div class="menu">
    <button class="menu__trigger">
      View
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content menu__content--lg">
      <div class="menu__header">Layout</div>
      <button class="menu__item menu__item--active">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3 3h4v4H3V3zm0 6h4v4H3V9zm6-6h4v4H9V3zm0 6h4v4H9V9z"/>
        </svg>
        <span class="menu__item-text">Grid</span>
      </button>
      <button class="menu__item">
        <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M2 4h12v2H2V4zm0 3h12v2H2V7zm0 3h12v2H2v-2z"/>
        </svg>
        <span class="menu__item-text">List</span>
      </button>
      <div class="menu__divider"></div>
      <div class="menu__header">Sort By</div>
      <button class="menu__item">Name</button>
      <button class="menu__item">Date Modified</button>
      <button class="menu__item">Size</button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>With Checkboxes</h3>
  <div class="menu">
    <button class="menu__trigger">
      Settings
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content">
      <button class="menu__item menu__item--check is-checked">Show sidebar</button>
      <button class="menu__item menu__item--check is-checked">Show toolbar</button>
      <button class="menu__item menu__item--check">Show line numbers</button>
      <button class="menu__item menu__item--check">Word wrap</button>
      <div class="menu__divider"></div>
      <button class="menu__item menu__item--check is-checked">Auto-save</button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Icon Button Trigger</h3>
  <div style="display: flex; gap: 12px;">
    <div class="menu">
      <button class="menu__trigger menu__trigger--icon" aria-label="More options">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3 8a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zm4.5 0a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zm4.5 0a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z"/>
        </svg>
      </button>
      <div class="menu__content">
        <button class="menu__item">View profile</button>
        <button class="menu__item">Edit</button>
        <button class="menu__item">Share</button>
        <div class="menu__divider"></div>
        <button class="menu__item menu__item--danger">Remove</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu__trigger menu__trigger--icon" aria-label="More options">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 4.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 4.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        </svg>
      </button>
      <div class="menu__content menu__content--right">
        <button class="menu__item">Action 1</button>
        <button class="menu__item">Action 2</button>
        <button class="menu__item">Action 3</button>
      </div>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Right Aligned</h3>
  <div style="text-align: right;">
    <div class="menu" style="display: inline-block;">
      <button class="menu__trigger">
        Account
        <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="menu__content menu__content--right">
        <button class="menu__item">Profile</button>
        <button class="menu__item">Settings</button>
        <button class="menu__item">Billing</button>
        <div class="menu__divider"></div>
        <button class="menu__item menu__item--danger">Sign out</button>
      </div>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Disabled Items</h3>
  <div class="menu">
    <button class="menu__trigger">
      Status
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content">
      <button class="menu__item">Active</button>
      <button class="menu__item">Pending</button>
      <button class="menu__item" disabled>Archived (requires permission)</button>
      <div class="menu__divider"></div>
      <button class="menu__item menu__item--danger" disabled>Delete (read-only)</button>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Practical Example: User Menu</h3>
  <div class="menu">
    <button class="menu__trigger" style="padding: 4px 8px; gap: 8px;">
      <div style="width: 28px; height: 28px; border-radius: 50%; background: var(--color-primary-500); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600;">JD</div>
      <span>John Doe</span>
      <svg class="menu__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </button>
    <div class="menu__content menu__content--lg">
      <div style="padding: 12px; border-bottom: 1px solid var(--border-default);">
        <p style="margin: 0; font-weight: 500;">John Doe</p>
        <p style="margin: 2px 0 0; font-size: 13px; color: var(--text-secondary);">john@example.com</p>
      </div>
      <div style="padding: 4px;">
        <button class="menu__item">
          <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 8a3 3 0 100-6 3 3 0 000 6zM8 9a6 6 0 00-6 6h12a6 6 0 00-6-6z"/>
          </svg>
          <span class="menu__item-text">Your Profile</span>
        </button>
        <button class="menu__item">
          <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" transform="translate(-2 -2) scale(1)"/>
          </svg>
          <span class="menu__item-text">Settings</span>
        </button>
        <button class="menu__item">
          <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 15A7 7 0 108 1a7 7 0 000 14zm0-1A6 6 0 118 2a6 6 0 010 12zM8 5a1 1 0 011 1v3a1 1 0 11-2 0V6a1 1 0 011-1zm0 7a1 1 0 100-2 1 1 0 000 2z"/>
          </svg>
          <span class="menu__item-text">Help & Support</span>
        </button>
      </div>
      <div class="menu__divider"></div>
      <div style="padding: 4px;">
        <button class="menu__item menu__item--danger">
          <svg class="menu__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2 3a1 1 0 011-1h4a1 1 0 010 2H4v8h4a1 1 0 110 2H3a1 1 0 01-1-1V3zm9.293 1.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L12.586 9H7a1 1 0 110-2h5.586l-1.293-1.293a1 1 0 010-1.414z"/>
          </svg>
          <span class="menu__item-text">Sign out</span>
        </button>
      </div>
    </div>
  </div>
</section>
