<!-- Input: With Prefix/Suffix -->
<div class="demo-showcase" style="flex-direction: column; align-items: stretch; max-width: 300px;">
  <div class="input-field">
    <label class="input-field__label">Website</label>
    <div class="input-addon">
      <span class="input-addon__text">https://</span>
      <input type="text" class="input" placeholder="example.com">
    </div>
  </div>
  <div class="input-field">
    <label class="input-field__label">Price</label>
    <div class="input-addon">
      <span class="input-addon__text">$</span>
      <input type="number" class="input" placeholder="0.00">
      <span class="input-addon__text">USD</span>
    </div>
  </div>
</div>
