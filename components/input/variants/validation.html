<!-- Input: Validation States -->
<div class="demo-showcase" style="flex-direction: column; align-items: stretch; max-width: 300px;">
  <div class="input-field">
    <label class="input-field__label">Error</label>
    <input type="text" class="input input--error" value="invalid@">
    <span class="input-field__error">Please enter a valid email</span>
  </div>
  <div class="input-field">
    <label class="input-field__label">Success</label>
    <input type="text" class="input input--success" value="valid@email.com">
    <span class="input-field__hint" style="color: var(--color-success-500);">Email is available</span>
  </div>
</div>
