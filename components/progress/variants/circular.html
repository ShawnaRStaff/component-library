<!-- Progress: Circular Progress -->
<div class="demo-showcase">
  <div class="demo-row" style="gap: 32px;">
    <div class="progress-circle progress-circle--sm" data-value="25">
      <svg class="progress-circle__svg" viewBox="0 0 48 48">
        <circle class="progress-circle__track" cx="24" cy="24" r="20"/>
        <circle class="progress-circle__fill" cx="24" cy="24" r="20"/>
      </svg>
      <div class="progress-circle__content">
        <span class="progress-circle__value">25%</span>
      </div>
    </div>

    <div class="progress-circle" data-value="60">
      <svg class="progress-circle__svg" viewBox="0 0 80 80">
        <circle class="progress-circle__track" cx="40" cy="40" r="36"/>
        <circle class="progress-circle__fill" cx="40" cy="40" r="36"/>
      </svg>
      <div class="progress-circle__content">
        <span class="progress-circle__value">60%</span>
        <span class="progress-circle__label">Complete</span>
      </div>
    </div>

    <div class="progress-circle progress-circle--lg progress-circle--success" data-value="85">
      <svg class="progress-circle__svg" viewBox="0 0 120 120">
        <circle class="progress-circle__track" cx="60" cy="60" r="55"/>
        <circle class="progress-circle__fill" cx="60" cy="60" r="55"/>
      </svg>
      <div class="progress-circle__content">
        <span class="progress-circle__value">85%</span>
        <span class="progress-circle__label">Score</span>
      </div>
    </div>
  </div>
</div>
