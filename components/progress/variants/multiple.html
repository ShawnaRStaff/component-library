<!-- Progress: Multiple Progress Bars -->
<div class="demo-showcase">
  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 400px;">
    <div class="progress-wrapper">
      <div class="progress__label">
        <span class="progress__label-text">HTML</span>
        <span class="progress__label-value">90%</span>
      </div>
      <div class="progress progress--success">
        <div class="progress__bar" style="width: 90%"></div>
      </div>
    </div>
    <div class="progress-wrapper">
      <div class="progress__label">
        <span class="progress__label-text">CSS</span>
        <span class="progress__label-value">85%</span>
      </div>
      <div class="progress">
        <div class="progress__bar" style="width: 85%"></div>
      </div>
    </div>
    <div class="progress-wrapper">
      <div class="progress__label">
        <span class="progress__label-text">JavaScript</span>
        <span class="progress__label-value">75%</span>
      </div>
      <div class="progress progress--warning">
        <div class="progress__bar" style="width: 75%"></div>
      </div>
    </div>
    <div class="progress-wrapper">
      <div class="progress__label">
        <span class="progress__label-text">React</span>
        <span class="progress__label-value">60%</span>
      </div>
      <div class="progress progress--info">
        <div class="progress__bar" style="width: 60%"></div>
      </div>
    </div>
  </div>
</div>
