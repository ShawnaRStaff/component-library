<!-- Accordion - Allow Multiple Open Variant -->
<div class="demo-showcase--full">
  <div class="accordion" data-allow-multiple style="max-width: 600px;">
    <div class="accordion__item is-open">
      <button class="accordion__header">
        First Item
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 7l5 5 5-5"/>
        </svg>
      </button>
      <div class="accordion__content">
        <div class="accordion__body">
          This accordion allows multiple items to be open at the same time.
        </div>
      </div>
    </div>
    <div class="accordion__item is-open">
      <button class="accordion__header">
        Second Item
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 7l5 5 5-5"/>
        </svg>
      </button>
      <div class="accordion__content">
        <div class="accordion__body">
          Both this item and the first item can be open simultaneously.
        </div>
      </div>
    </div>
    <div class="accordion__item">
      <button class="accordion__header">
        Third Item
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 7l5 5 5-5"/>
        </svg>
      </button>
      <div class="accordion__content">
        <div class="accordion__body">
          Click to open this item too.
        </div>
      </div>
    </div>
  </div>
</div>
