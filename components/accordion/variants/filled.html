<!-- Accordion - Filled Header Variant -->
<div class="demo-showcase--full">
  <div class="accordion accordion--filled" style="max-width: 600px;">
    <div class="accordion__item is-open">
      <button class="accordion__header">
        Active Section
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 7l5 5 5-5"/>
        </svg>
      </button>
      <div class="accordion__content">
        <div class="accordion__body">
          This section is currently expanded and has a highlighted header.
        </div>
      </div>
    </div>
    <div class="accordion__item">
      <button class="accordion__header">
        Inactive Section
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 7l5 5 5-5"/>
        </svg>
      </button>
      <div class="accordion__content">
        <div class="accordion__body">
          Click to expand this section.
        </div>
      </div>
    </div>
  </div>
</div>
