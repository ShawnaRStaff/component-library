      </button>
      <div class="accordion__content">
        <div class="accordion__body">

    <div class="accordion__item">
      <button class="accordion__header">

        </div>

    </div>
    <div class="accordion__item">
      <button class="accordion__header">
        Notification Settings
        <svg class="accordion__icon" viewBox="0 0 20 20" fill="currentColor">
