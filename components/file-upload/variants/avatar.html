<!-- File Upload: Avatar -->
<div class="demo-showcase">
  <div style="display: flex; align-items: center; gap: 24px;">
    <div class="file-upload file-upload--avatar">
      <input type="file" class="file-upload__input" accept="image/*">
      <div class="file-upload__content">
        <svg class="file-upload__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="24" cy="20" r="8"/>
          <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
        </svg>
      </div>
    </div>
    <div>
      <p style="margin: 0 0 4px; font-weight: 500;">Profile Photo</p>
      <p style="margin: 0; font-size: 14px; color: var(--text-secondary);">Click the circle to upload</p>
    </div>
  </div>
</div>
