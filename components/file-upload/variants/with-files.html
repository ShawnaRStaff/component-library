<!-- File Upload: With Pre-existing Files -->
<div class="demo-showcase">
  <div style="max-width: 500px;">
    <div class="file-upload file-upload--sm">
      <input type="file" class="file-upload__input" multiple>
      <div class="file-upload__content">
        <svg class="file-upload__icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"/>
        </svg>
        <p class="file-upload__text"><strong>Add more files</strong></p>
      </div>
    </div>

    <div class="file-upload__list">
      <div class="file-upload__item">
        <img src="https://via.placeholder.com/48" class="file-upload__preview" alt="Preview">
        <div class="file-upload__item-info">
          <p class="file-upload__item-name">photo-vacation.jpg</p>
          <p class="file-upload__item-size">2.4 MB</p>
        </div>
        <button type="button" class="file-upload__item-remove" aria-label="Remove">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>

      <div class="file-upload__item">
        <div class="file-upload__item-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/>
          </svg>
        </div>
        <div class="file-upload__item-info">
          <p class="file-upload__item-name">document-report-2024.pdf</p>
          <p class="file-upload__item-size">456 KB</p>
        </div>
        <button type="button" class="file-upload__item-remove" aria-label="Remove">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
