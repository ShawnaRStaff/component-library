<!-- File Upload: Large -->
<div class="demo-showcase">
  <div style="max-width: 600px;">
    <div class="file-upload file-upload--lg">
      <input type="file" class="file-upload__input" multiple accept="image/*">
      <div class="file-upload__content">
        <svg class="file-upload__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="10" width="36" height="28" rx="4"/>
          <circle cx="18" cy="22" r="4"/>
          <path d="M42 38l-10-10-8 8-6-6-12 12"/>
        </svg>
        <p class="file-upload__text">
          <strong>Drag photos here</strong> or click to browse
        </p>
        <p class="file-upload__hint">Upload up to 10 images at once (PNG, JPG, GIF)</p>
      </div>
    </div>
  </div>
</div>
