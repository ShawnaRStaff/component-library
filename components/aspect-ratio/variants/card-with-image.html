<!-- Aspect Ratio: Card with Aspect Ratio Image -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; max-width: 900px;">
    <div style="background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden;">
      <div class="aspect-ratio aspect-ratio--16-9">
        <img src="https://picsum.photos/400/225?random=28" alt="">
      </div>
      <div style="padding: 16px;">
        <h4 style="margin: 0 0 8px; font-size: 16px;">Card Title</h4>
        <p style="margin: 0; font-size: 14px; color: var(--text-secondary);">This card uses a 16:9 aspect ratio for its image.</p>
      </div>
    </div>
    <div style="background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden;">
      <div class="aspect-ratio aspect-ratio--4-3">
        <img src="https://picsum.photos/400/300?random=29" alt="">
      </div>
      <div style="padding: 16px;">
        <h4 style="margin: 0 0 8px; font-size: 16px;">Another Card</h4>
        <p style="margin: 0; font-size: 14px; color: var(--text-secondary);">This card uses a 4:3 aspect ratio for its image.</p>
      </div>
    </div>
  </div>
</div>
