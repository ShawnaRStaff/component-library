<!-- Aspect Ratio: Object Position -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; max-width: 800px;">
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Top</p>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--top aspect-ratio--rounded">
        <img src="https://picsum.photos/400/600?random=11" alt="Top position">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Center (default)</p>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/600?random=11" alt="Center position">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Bottom</p>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--bottom aspect-ratio--rounded">
        <img src="https://picsum.photos/400/600?random=11" alt="Bottom position">
      </div>
    </div>
  </div>
</div>
