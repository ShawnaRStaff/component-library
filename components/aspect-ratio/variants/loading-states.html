<!-- Aspect Ratio: Loading & Placeholder States -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;">
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Placeholder</p>
      <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded aspect-ratio--placeholder"></div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Loading (Shimmer)</p>
      <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded aspect-ratio--loading"></div>
    </div>
  </div>
</div>
