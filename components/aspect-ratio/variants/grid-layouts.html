<!-- Aspect Ratio: Grid Layouts -->
<div class="demo-showcase">
  <div style="max-width: 800px;">
    <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">2 Column Grid</p>
    <div class="aspect-ratio-grid aspect-ratio-grid--2" style="margin-bottom: 24px;">
      <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/225?random=20" alt="">
      </div>
      <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/225?random=21" alt="">
      </div>
    </div>

    <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">3 Column Grid</p>
    <div class="aspect-ratio-grid aspect-ratio-grid--3" style="margin-bottom: 24px;">
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--rounded">
        <img src="https://picsum.photos/300/300?random=22" alt="">
      </div>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--rounded">
        <img src="https://picsum.photos/300/300?random=23" alt="">
      </div>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--rounded">
        <img src="https://picsum.photos/300/300?random=24" alt="">
      </div>
    </div>

    <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">Featured Layout</p>
    <div class="aspect-ratio-grid aspect-ratio-grid--featured" style="height: 300px;">
      <div class="aspect-ratio aspect-ratio--rounded" style="height: 100%;">
        <img src="https://picsum.photos/600/400?random=25" alt="">
        <div class="aspect-ratio__overlay aspect-ratio__overlay--gradient-bottom">
          <div style="font-weight: 600;">Featured Image</div>
        </div>
      </div>
      <div class="aspect-ratio aspect-ratio--rounded">
        <img src="https://picsum.photos/300/200?random=26" alt="">
      </div>
      <div class="aspect-ratio aspect-ratio--rounded">
        <img src="https://picsum.photos/300/200?random=27" alt="">
      </div>
    </div>
  </div>
</div>
