<!-- Aspect Ratio: Portrait Ratios -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 200px)); gap: 24px;">
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">4:5 (Instagram)</p>
      <div class="aspect-ratio aspect-ratio--4-5 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/500?random=5" alt="4:5 image">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">2:3 (Portrait)</p>
      <div class="aspect-ratio aspect-ratio--2-3 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/600?random=6" alt="2:3 image">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">9:16 (Stories)</p>
      <div class="aspect-ratio aspect-ratio--9-16 aspect-ratio--rounded">
        <img src="https://picsum.photos/225/400?random=7" alt="9:16 image">
      </div>
    </div>
  </div>
</div>
