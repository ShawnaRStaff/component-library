<!-- Aspect Ratio: Common Aspect Ratios -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;">
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">1:1 (Square)</p>
      <div class="aspect-ratio aspect-ratio--1-1 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/400?random=1" alt="Square image">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">4:3 (Classic)</p>
      <div class="aspect-ratio aspect-ratio--4-3 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/300?random=2" alt="4:3 image">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">16:9 (Widescreen)</p>
      <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/225?random=3" alt="16:9 image">
      </div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">21:9 (Cinematic)</p>
      <div class="aspect-ratio aspect-ratio--21-9 aspect-ratio--rounded">
        <img src="https://picsum.photos/400/171?random=4" alt="21:9 image">
      </div>
    </div>
  </div>
</div>
