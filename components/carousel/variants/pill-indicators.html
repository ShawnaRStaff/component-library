<!-- Carousel - Pill Indicators Variant -->
<div class="demo-showcase">
  <div class="carousel carousel--indicators-pill" data-carousel data-loop style="max-width: 600px;">
    <div class="carousel__track">
      <div class="carousel__slide">
        <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
          <img src="https://picsum.photos/800/450?random=60" alt="Slide 1">
        </div>
      </div>
      <div class="carousel__slide">
        <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
          <img src="https://picsum.photos/800/450?random=61" alt="Slide 2">
        </div>
      </div>
      <div class="carousel__slide">
        <div class="aspect-ratio aspect-ratio--16-9 aspect-ratio--rounded">
          <img src="https://picsum.photos/800/450?random=62" alt="Slide 3">
        </div>
      </div>
    </div>
    <button class="carousel__nav carousel__nav--prev" aria-label="Previous">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/>
      </svg>
    </button>
    <button class="carousel__nav carousel__nav--next" aria-label="Next">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/>
      </svg>
    </button>
    <div class="carousel__indicators">
      <button class="carousel__indicator is-active"></button>
      <button class="carousel__indicator"></button>
      <button class="carousel__indicator"></button>
    </div>
  </div>
</div>
