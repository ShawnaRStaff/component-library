<!-- Spinner Component Demo -->

<section class="demo-section">
  <h3>Default Spinner</h3>
  <div class="demo-row">
    <span class="spinner"></span>
  </div>
</section>

<section class="demo-section">
  <h3>Sizes</h3>
  <div class="demo-row">
    <span class="spinner spinner--xs"></span>
    <span class="spinner spinner--sm"></span>
    <span class="spinner spinner--md"></span>
    <span class="spinner spinner--lg"></span>
    <span class="spinner spinner--xl"></span>
  </div>
</section>

<section class="demo-section">
  <h3>Colors</h3>
  <div class="demo-row">
    <span class="spinner spinner--primary"></span>
    <span class="spinner spinner--secondary"></span>
    <span class="spinner spinner--success"></span>
    <span class="spinner spinner--danger"></span>
    <span class="spinner spinner--warning"></span>
  </div>
</section>

<section class="demo-section">
  <h3>Inverse (for dark backgrounds)</h3>
  <div class="demo-row" style="background: var(--color-neutral-800); padding: 16px; border-radius: 8px;">
    <span class="spinner spinner--inverse"></span>
    <span class="spinner spinner--inverse spinner--lg"></span>
  </div>
</section>

<section class="demo-section">
  <h3>Alternative Styles</h3>
  <div class="demo-row">
    <div style="text-align: center;">
      <div class="spinner-dots">
        <span class="spinner-dots__dot"></span>
        <span class="spinner-dots__dot"></span>
        <span class="spinner-dots__dot"></span>
      </div>
      <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">Dots</p>
    </div>
    <div style="text-align: center; margin-left: 32px;">
      <span class="spinner-pulse"></span>
      <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">Pulse</p>
    </div>
    <div style="text-align: center; margin-left: 32px;">
      <div class="spinner-bar">
        <span class="spinner-bar__bar"></span>
        <span class="spinner-bar__bar"></span>
        <span class="spinner-bar__bar"></span>
        <span class="spinner-bar__bar"></span>
      </div>
      <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">Bars</p>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>With Text</h3>
  <div class="demo-row">
    <span class="spinner spinner--sm"></span>
    <span style="margin-left: 8px;">Loading...</span>
  </div>
</section>

<section class="demo-section">
  <h3>Inside Button</h3>
  <div class="demo-row">
    <button class="btn btn--primary" disabled style="gap: 8px;">
      <span class="spinner spinner--xs spinner--inverse"></span>
      Saving...
    </button>
  </div>
</section>
