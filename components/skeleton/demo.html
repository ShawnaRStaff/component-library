<!-- Skeleton Component Demo -->

<section class="demo-section">
  <h3>Basic Shapes</h3>
  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 400px;">
    <div class="skeleton skeleton--text"></div>
    <div class="skeleton skeleton--text skeleton--w-3/4"></div>
    <div class="skeleton skeleton--text skeleton--w-1/2"></div>
  </div>
</section>

<section class="demo-section">
  <h3>Avatar Sizes</h3>
  <div style="display: flex; align-items: center; gap: 16px;">
    <div class="skeleton skeleton--avatar-sm"></div>
    <div class="skeleton skeleton--avatar"></div>
    <div class="skeleton skeleton--avatar-lg"></div>
  </div>
</section>

<section class="demo-section">
  <h3>Common Elements</h3>
  <div style="display: flex; flex-wrap: wrap; gap: 16px;">
    <div class="skeleton skeleton--button"></div>
    <div class="skeleton skeleton--thumbnail"></div>
    <div class="skeleton skeleton--image" style="width: 200px; height: 120px;"></div>
  </div>
</section>

<section class="demo-section">
  <h3>Animation Variants</h3>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 600px;">
    <div>
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Shimmer (default)</p>
      <div class="skeleton skeleton--text"></div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Pulse</p>
      <div class="skeleton skeleton--pulse skeleton--text"></div>
    </div>
    <div>
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Wave</p>
      <div class="skeleton skeleton--wave skeleton--text"></div>
    </div>
  </div>
</section>

<section class="demo-section">

    <div class="skeleton skeleton--image" style="margin-bottom: 16px;"></div>

      <div class="skeleton skeleton--text"></div>

  </div>
</section>
