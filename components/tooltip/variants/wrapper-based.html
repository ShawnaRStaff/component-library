<!-- Tooltip: Wrapper-based -->
<div class="demo-showcase">
  <div class="demo-row" style="gap: 48px; padding-top: 80px;">
    <div class="tooltip-wrapper">
      <button class="btn btn--secondary">Hover me</button>
      <div class="tooltip__content">
        <div class="tooltip__title">Pro Tip</div>
        <div class="tooltip__text">You can use keyboard shortcuts for faster navigation.</div>
      </div>
    </div>

    <div class="tooltip-wrapper tooltip-wrapper--bottom">
      <button class="btn btn--secondary">Bottom tooltip</button>
      <div class="tooltip__content">
        This appears below the button
      </div>
    </div>
  </div>
</div>
