<!-- Select: Custom Select -->
<div class="demo-showcase">
  <div style="max-width: 300px;">
    <div class="dropdown dropdown--block">
      <button class="dropdown__trigger" aria-haspopup="listbox">
        <span class="select-dropdown__value select-dropdown__placeholder">Select an option...</span>
        <svg class="dropdown__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="dropdown__menu" role="listbox">
        <button class="dropdown__item" role="option">Option 1</button>
        <button class="dropdown__item" role="option">Option 2</button>
        <button class="dropdown__item" role="option">Option 3</button>
      </div>
    </div>
  </div>
</div>
