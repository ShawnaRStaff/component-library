<!-- Select: With Groups -->
<div class="demo-showcase">
  <div style="max-width: 300px;">
    <div class="dropdown dropdown--block">
      <button class="dropdown__trigger" aria-haspopup="listbox">
        <span class="select-dropdown__value select-dropdown__placeholder">Select a fruit...</span>
        <svg class="dropdown__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="dropdown__menu" role="listbox">
        <div class="dropdown__header">Citrus</div>
        <button class="dropdown__item" role="option">Orange</button>
        <button class="dropdown__item" role="option">Lemon</button>
        <button class="dropdown__item" role="option">Grapefruit</button>
        <div class="dropdown__divider"></div>
        <div class="dropdown__header">Berries</div>
        <button class="dropdown__item" role="option">Strawberry</button>
        <button class="dropdown__item" role="option">Blueberry</button>
        <button class="dropdown__item" role="option">Raspberry</button>
      </div>
    </div>
  </div>
</div>
