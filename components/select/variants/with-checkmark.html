<!-- Select: With Checkmark -->
<div class="demo-showcase">
  <div style="max-width: 300px;">
    <div class="dropdown dropdown--block">
      <button class="dropdown__trigger" aria-haspopup="listbox">
        <span class="select-dropdown__value">Newest first</span>
        <svg class="dropdown__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="dropdown__menu" role="listbox">
        <button class="dropdown__item dropdown__item--selected" role="option">
          Newest first
          <svg class="dropdown__item-check" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13 4L6 11 3 8" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
        <button class="dropdown__item" role="option">
          Oldest first
          <svg class="dropdown__item-check" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13 4L6 11 3 8" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
        <button class="dropdown__item" role="option">
          Name A-Z
          <svg class="dropdown__item-check" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13 4L6 11 3 8" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
        <button class="dropdown__item" role="option">
          Name Z-A
          <svg class="dropdown__item-check" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13 4L6 11 3 8" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
