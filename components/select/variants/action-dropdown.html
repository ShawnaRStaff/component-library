<!-- Select: Action Dropdown -->
<div class="demo-showcase">
  <div class="demo-row">
    <div class="dropdown">
      <button class="dropdown__trigger">
        <span>Actions</span>
        <svg class="dropdown__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="dropdown__menu">
        <button class="dropdown__item">
          <svg class="dropdown__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M12.1 1.9a1.5 1.5 0 012.1 2.1l-9 9-3 1 1-3 9-9z"/>
          </svg>
          Edit
        </button>
        <button class="dropdown__item">
          <svg class="dropdown__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 4v10h8V4H4zM3 2h10v12H3V2z"/>
          </svg>
          Duplicate
        </button>
        <button class="dropdown__item">
          <svg class="dropdown__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2 4h12v9H2V4zm1 1v7h10V5H3z"/>
          </svg>
          Archive
        </button>
        <div class="dropdown__divider"></div>
        <button class="dropdown__item dropdown__item--danger">
          <svg class="dropdown__item-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 5.5v6m2.5-6v6m2.5-6v6M3 3.5h10l-.5 10a1 1 0 01-1 1H4.5a1 1 0 01-1-1L3 3.5z"/>
          </svg>
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
