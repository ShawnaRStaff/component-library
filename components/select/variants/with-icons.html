<!-- Select: With Icons -->
<div class="demo-showcase">
  <div style="max-width: 300px;">
    <div class="dropdown dropdown--block">
      <button class="dropdown__trigger" aria-haspopup="listbox">
        <span class="select-dropdown__value select-dropdown__placeholder">Select a country...</span>
        <svg class="dropdown__trigger-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
      <div class="dropdown__menu" role="listbox">
        <button class="dropdown__item" role="option">
          <span style="font-size: 18px; line-height: 1;">&#127482;&#127480;</span>
          United States
        </button>
        <button class="dropdown__item" role="option">
          <span style="font-size: 18px; line-height: 1;">&#127468;&#127463;</span>
          United Kingdom
        </button>
        <button class="dropdown__item" role="option">
          <span style="font-size: 18px; line-height: 1;">&#127464;&#127462;</span>
          Canada
        </button>
        <button class="dropdown__item" role="option">
          <span style="font-size: 18px; line-height: 1;">&#127462;&#127482;</span>
          Australia
        </button>
      </div>
    </div>
  </div>
</div>
