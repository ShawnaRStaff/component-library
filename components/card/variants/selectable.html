<!-- Card - Selectable Cards Variant -->

      <div class="card__body" style="text-align: center;">
        <h4>Basic</h4>
        <p style="font-size: 24px; font-weight: bold; margin: 8px 0;">$9</p>

      </div>
    </div>
    <div class="card card--selectable is-selected">
      <div class="card__body" style="text-align: center;">
        <h4>Pro</h4>
        <p style="font-size: 24px; font-weight: bold; margin: 8px 0;">$29</p>

      </div>
    </div>
    <div class="card card--selectable">
      <div class="card__body" style="text-align: center;">
        <h4>Enterprise</h4>
        <p style="font-size: 24px; font-weight: bold; margin: 8px 0;">$99</p>
        <p>/month</p>
      </div>
    </div>
  </div>
</div>
