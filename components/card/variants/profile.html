<!-- Card - Profile Card Variant -->
<div class="demo-showcase">
  <div style="max-width: 300px;">
    <div class="card card--profile">
      <div class="card__body">
        <div class="avatar avatar--xl" style="margin-bottom: 16px;">
          <img src="https://i.pravatar.cc/150?img=32" alt="Profile" class="avatar__image">
        </div>
        <h3 class="card__title">Sarah Wilson</h3>
        <p style="margin-top: 4px;">Product Designer</p>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button class="btn btn--primary btn--sm">Follow</button>
          <button class="btn btn--secondary btn--sm">Message</button>
        </div>
      </div>
    </div>
  </div>
</div>
