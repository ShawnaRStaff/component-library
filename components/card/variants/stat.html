<!-- Card - Stat Cards Variant -->
<div class="demo-showcase">
  <div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
    <div class="card card--stat">
      <div class="card__body">
        <span class="card__stat-label">Total Revenue</span>
        <span class="card__stat-value">$45,231</span>
        <span class="card__stat-change card__stat-change--up">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 4l4 4H4l4-4z"/>
          </svg>
          12% from last month
        </span>
      </div>
    </div>
    <div class="card card--stat">
      <div class="card__body">
        <span class="card__stat-label">Active Users</span>
        <span class="card__stat-value">2,350</span>
        <span class="card__stat-change card__stat-change--up">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 4l4 4H4l4-4z"/>
          </svg>
          8% from last week
        </span>
      </div>
    </div>
    <div class="card card--stat">
      <div class="card__body">
        <span class="card__stat-label">Bounce Rate</span>
        <span class="card__stat-value">24.5%</span>
        <span class="card__stat-change card__stat-change--down">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12l4-4H4l4 4z"/>
          </svg>
          3% from last month
        </span>
      </div>
    </div>
  </div>
</div>
