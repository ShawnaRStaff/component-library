<!-- Card - Status Cards Variant -->
<div class="demo-showcase">
  <div class="card-list" style="max-width: 400px;">
    <div class="card card--status-success">
      <div class="card__body">
        <h4 style="margin-bottom: 4px;">Build Successful</h4>
        <p>All tests passed. Ready for deployment.</p>
      </div>
    </div>
    <div class="card card--status-warning">
      <div class="card__body">
        <h4 style="margin-bottom: 4px;">Review Pending</h4>
        <p>Waiting for code review approval.</p>
      </div>
    </div>
    <div class="card card--status-danger">
      <div class="card__body">
        <h4 style="margin-bottom: 4px;">Build Failed</h4>
        <p>3 tests failed. Check the logs.</p>
      </div>
    </div>
  </div>
</div>
