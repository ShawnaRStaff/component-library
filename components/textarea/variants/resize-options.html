<!-- Textarea: Resize Options -->
<div class="demo-showcase">
  <div style="max-width: 500px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 500;">No resize</label>
      <textarea class="textarea textarea--resize-none textarea--sm" placeholder="Cannot resize this textarea"></textarea>
    </div>
    <div>
      <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 500;">Horizontal resize</label>
      <textarea class="textarea textarea--resize-horizontal textarea--sm" placeholder="Can resize horizontally"></textarea>
    </div>
    <div>
      <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 500;">Both directions</label>
      <textarea class="textarea textarea--resize-both textarea--sm" placeholder="Can resize in any direction"></textarea>
    </div>
  </div>
</div>
