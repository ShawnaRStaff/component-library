<!-- Avatar: With Status Indicator -->
<div class="demo-showcase">
  <div class="avatar">
    <img src="https://i.pravatar.cc/150?img=7" alt="User" class="avatar__image">
    <span class="avatar__status avatar__status--online"></span>
  </div>
  <div class="avatar">
    <img src="https://i.pravatar.cc/150?img=8" alt="User" class="avatar__image">
    <span class="avatar__status avatar__status--away"></span>
  </div>
  <div class="avatar">
    <img src="https://i.pravatar.cc/150?img=9" alt="User" class="avatar__image">
    <span class="avatar__status avatar__status--busy"></span>
  </div>
  <div class="avatar">
    <img src="https://i.pravatar.cc/150?img=10" alt="User" class="avatar__image">
    <span class="avatar__status avatar__status--offline"></span>
  </div>
</div>

<div class="demo-showcase" style="margin-top: var(--space-4);">
  <span style="color: var(--text-tertiary); font-size: var(--font-size-sm);">Online</span>
  <span style="color: var(--text-tertiary); font-size: var(--font-size-sm);">Away</span>
  <span style="color: var(--text-tertiary); font-size: var(--font-size-sm);">Busy</span>
  <span style="color: var(--text-tertiary); font-size: var(--font-size-sm);">Offline</span>
</div>
