<!-- Pagination: Disabled State -->
<div class="demo-showcase">
  <nav class="pagination" aria-label="Pagination">
    <button class="pagination__btn pagination__btn--prev" disabled>
      <svg class="pagination__btn-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M10 12L6 8l4-4"/>
      </svg>
      Previous
    </button>
    <div class="pagination__pages">
      <button class="pagination__page is-active">1</button>
      <button class="pagination__page">2</button>
      <button class="pagination__page">3</button>
    </div>
    <button class="pagination__btn pagination__btn--next">
      Next
      <svg class="pagination__btn-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M6 4l4 4-4 4"/>
      </svg>
    </button>
  </nav>
  <p style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">Previous button disabled on first page</p>
</div>
