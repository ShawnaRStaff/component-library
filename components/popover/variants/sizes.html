<!-- Popover: Size Variants -->
<div class="demo-showcase">
  <div style="display: flex; gap: 24px; flex-wrap: wrap;">
    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="small">Small</button>
      <div class="popover popover--bottom popover--sm" data-popover="small" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Compact popover</div>
        </div>
      </div>
    </div>

    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="default-size">Default</button>
      <div class="popover popover--bottom" data-popover="default-size" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Standard sized popover with typical content width.</div>
        </div>
      </div>
    </div>

    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="large">Large</button>
      <div class="popover popover--bottom popover--lg" data-popover="large" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Large popover for more detailed content. Great for forms, settings panels, or rich information displays.</div>
        </div>
      </div>
    </div>
  </div>
</div>
