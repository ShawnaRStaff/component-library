<!-- Popover: Dark Theme -->
<div class="demo-showcase">
  <div style="display: flex; gap: 24px; flex-wrap: wrap;">
    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="dark">Dark Popover</button>
      <div class="popover popover--bottom popover--dark" data-popover="dark" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__header">
            <h4 class="popover__title">Dark Theme</h4>
            <button class="popover__close" aria-label="Close">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
              </svg>
            </button>
          </div>
          <div class="popover__body">
            This popover uses a dark theme for contrast against light backgrounds.
          </div>
        </div>
      </div>
    </div>

    <div class="popover-trigger popover-trigger--hover">
      <span style="padding: 4px 8px; background: var(--color-neutral-800); color: white; border-radius: 4px; cursor: help;">Hover (Dark)</span>
      <div class="popover popover--top popover--dark popover--sm">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Dark tooltip style</div>
        </div>
      </div>
    </div>
  </div>
</div>
