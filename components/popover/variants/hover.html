<!-- Popover: Hover Trigger -->
<div class="demo-showcase">
  <div style="display: flex; gap: 24px; flex-wrap: wrap;">
    <div class="popover-trigger popover-trigger--hover">
      <button class="btn btn--secondary">Hover Me</button>
      <div class="popover popover--bottom">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">
            This popover appears on hover without requiring a click.
          </div>
        </div>
      </div>
    </div>

    <div class="popover-trigger popover-trigger--hover">
      <span style="text-decoration: underline; cursor: help;">Hover for tooltip</span>
      <div class="popover popover--top popover--sm">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">
            Helpful information on hover
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
