<!-- Popover: Rich Content -->
<div class="demo-showcase">
  <div class="popover-trigger">
    <button class="btn btn--primary" data-popover-trigger="rich">User Profile</button>
    <div class="popover popover--bottom popover--lg" data-popover="rich" aria-hidden="true">
      <div class="popover__arrow"></div>
      <div class="popover__content" style="width: 320px;">
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <img src="https://i.pravatar.cc/64?img=8" alt="User" style="width: 64px; height: 64px; border-radius: 50%;">
          <div>
            <div style="font-weight: 600; color: var(--text-primary);">Sarah Johnson</div>
            <div style="font-size: 14px; color: var(--text-secondary);">Senior Designer</div>
            <div style="font-size: 12px; color: var(--color-success-600); margin-top: 4px;">
              <span style="display: inline-block; width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 4px;"></span>
              Online
            </div>
          </div>
        </div>
        <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
          Creating beautiful interfaces and user experiences. Love coffee and hiking.
        </div>
        <div class="popover__footer" style="border: none; padding-top: 0; margin-top: 0;">
          <button class="btn btn--ghost btn--sm" style="flex: 1;">Message</button>
          <button class="btn btn--primary btn--sm" style="flex: 1;">View Profile</button>
        </div>
      </div>
    </div>
  </div>
</div>
