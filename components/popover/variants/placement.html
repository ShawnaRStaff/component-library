<!-- Popover: Placement Options -->
<div class="demo-showcase">
  <div style="display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; padding: 60px 20px;">
    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="top">Top</button>
      <div class="popover popover--top" data-popover="top" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Positioned above the trigger</div>
        </div>
      </div>
    </div>

    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="bottom">Bottom</button>
      <div class="popover popover--bottom" data-popover="bottom" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Positioned below the trigger</div>
        </div>
      </div>
    </div>

    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="left">Left</button>
      <div class="popover popover--left" data-popover="left" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Positioned to the left</div>
        </div>
      </div>
    </div>

    <div class="popover-trigger">
      <button class="btn btn--secondary" data-popover-trigger="right">Right</button>
      <div class="popover popover--right" data-popover="right" aria-hidden="true">
        <div class="popover__arrow"></div>
        <div class="popover__content">
          <div class="popover__body">Positioned to the right</div>
        </div>
      </div>
    </div>
  </div>
</div>
