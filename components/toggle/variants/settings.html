<!-- Toggle: Settings Pattern -->
<div class="demo-showcase" style="flex-direction: column; align-items: stretch; max-width: 500px;">
  <div class="toggle-row">
    <div class="toggle-row__content">
      <div class="toggle-row__title">Dark Mode</div>
      <div class="toggle-row__description">Use dark theme across the application</div>
    </div>
    <label class="toggle">
      <input type="checkbox" class="toggle__input">
      <span class="toggle__track"></span>
    </label>
  </div>
  <div class="toggle-row">
    <div class="toggle-row__content">
      <div class="toggle-row__title">Auto-save</div>
      <div class="toggle-row__description">Automatically save changes as you work</div>
    </div>
    <label class="toggle">
      <input type="checkbox" class="toggle__input" checked>
      <span class="toggle__track"></span>
    </label>
  </div>
  <div class="toggle-row">
    <div class="toggle-row__content">
      <div class="toggle-row__title">Analytics</div>
      <div class="toggle-row__description">Help us improve by sending anonymous usage data</div>
    </div>
    <label class="toggle">
      <input type="checkbox" class="toggle__input">
      <span class="toggle__track"></span>
    </label>
  </div>
</div>
