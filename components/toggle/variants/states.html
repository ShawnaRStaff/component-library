<!-- Toggle: States -->
<div class="demo-showcase">
  <label class="toggle">
    <input type="checkbox" class="toggle__input">
    <span class="toggle__track"></span>
    <span class="toggle__label">Off</span>
  </label>
  <label class="toggle">
    <input type="checkbox" class="toggle__input" checked>
    <span class="toggle__track"></span>
    <span class="toggle__label">On</span>
  </label>
</div>

<div class="demo-showcase" style="margin-top: var(--space-4);">
  <label class="toggle">
    <input type="checkbox" class="toggle__input" disabled>
    <span class="toggle__track"></span>
    <span class="toggle__label">Disabled Off</span>
  </label>
  <label class="toggle">
    <input type="checkbox" class="toggle__input" disabled checked>
    <span class="toggle__track"></span>
    <span class="toggle__label">Disabled On</span>
  </label>
</div>
