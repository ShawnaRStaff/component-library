<!-- Toggle: Colors -->
<div class="demo-showcase">
  <label class="toggle">
    <input type="checkbox" class="toggle__input" checked>
    <span class="toggle__track"></span>
    <span class="toggle__label">Primary</span>
  </label>
  <label class="toggle toggle--success">
    <input type="checkbox" class="toggle__input" checked>
    <span class="toggle__track"></span>
    <span class="toggle__label">Success</span>
  </label>
  <label class="toggle toggle--danger">
    <input type="checkbox" class="toggle__input" checked>
    <span class="toggle__track"></span>
    <span class="toggle__label">Danger</span>
  </label>
</div>
