<!-- Slider Component Demo -->

<section class="demo-section">
  <h3>Basic Slider</h3>
  <div class="slider" style="max-width: 400px;">
    <input type="range" class="slider__input" min="0" max="100" value="50">
  </div>
</section>

<section class="demo-section">
  <h3>Slider with Label and Value</h3>
  <div class="slider" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Volume</label>
      <span class="slider__value">50%</span>
    </div>
    <input type="range" class="slider__input" min="0" max="100" value="50" data-suffix="%">
  </div>
</section>

<section class="demo-section">
  <h3>With Ticks/Steps</h3>
  <div class="slider" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Rating</label>
      <span class="slider__value">3</span>
    </div>
    <input type="range" class="slider__input" min="1" max="5" step="1" value="3">
    <div class="slider__ticks">
      <span class="slider__tick">1</span>
      <span class="slider__tick">2</span>
      <span class="slider__tick">3</span>
      <span class="slider__tick">4</span>
      <span class="slider__tick">5</span>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Size Variants</h3>
  <div style="max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
    <div class="slider slider--sm">
      <div class="slider__header">
        <label class="slider__label">Small</label>
        <span class="slider__value">25</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="25">
    </div>

    <div class="slider">
      <div class="slider__header">
        <label class="slider__label">Default</label>
        <span class="slider__value">50</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="50">
    </div>

    <div class="slider slider--lg">
      <div class="slider__header">
        <label class="slider__label">Large</label>
        <span class="slider__value">75</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="75">
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Color Variants</h3>
  <div style="max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
    <div class="slider">
      <div class="slider__header">
        <label class="slider__label">Primary</label>
        <span class="slider__value">60</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="60">
    </div>

    <div class="slider slider--success">
      <div class="slider__header">
        <label class="slider__label">Success</label>
        <span class="slider__value">80</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="80">
    </div>

    <div class="slider slider--warning">
      <div class="slider__header">
        <label class="slider__label">Warning</label>
        <span class="slider__value">40</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="40">
    </div>

    <div class="slider slider--danger">
      <div class="slider__header">
        <label class="slider__label">Danger</label>
        <span class="slider__value">20</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="20">
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Disabled State</h3>
  <div class="slider slider--disabled" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Disabled</label>
      <span class="slider__value">50</span>
    </div>
    <input type="range" class="slider__input" min="0" max="100" value="50" disabled>
  </div>
</section>

<section class="demo-section">
  <h3>Price Range (Two Handles)</h3>
  <div class="slider slider--range" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Price Range</label>
      <span>
        <span data-range-min>$200</span> - <span data-range-max>$800</span>
      </span>
    </div>
    <div class="slider__track">
      <div class="slider__track-fill" style="left: 20%; width: 60%;"></div>
    </div>
    <div class="slider__inputs">
      <input type="range" class="slider__input" min="0" max="1000" value="200" data-prefix="$">
      <input type="range" class="slider__input" min="0" max="1000" value="800" data-prefix="$">
    </div>
    <div class="slider__ticks">
      <span class="slider__tick">$0</span>
      <span class="slider__tick">$500</span>
      <span class="slider__tick">$1000</span>
    </div>
  </div>
</section>

<section class="demo-section">
  <h3>Practical Examples</h3>
  <div style="max-width: 400px; display: flex; flex-direction: column; gap: 32px;">
    <!-- Brightness Control -->
    <div class="slider">
      <div class="slider__header">
        <label class="slider__label" style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
          </svg>
          Brightness
        </label>
        <span class="slider__value">70%</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="70" data-suffix="%">
    </div>

    <!-- Temperature -->
    <div class="slider slider--warning">
      <div class="slider__header">
        <label class="slider__label" style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 00-1 1v6.293l-1.146-1.147a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 9.293V3a1 1 0 00-1-1z"/>
            <path d="M5 14a5 5 0 1010 0 5 5 0 00-10 0z"/>
          </svg>
          Temperature
        </label>
        <span class="slider__value">72°F</span>
      </div>
      <input type="range" class="slider__input" min="60" max="85" value="72" data-suffix="°F">
      <div class="slider__ticks">
        <span class="slider__tick">60°</span>
        <span class="slider__tick">72°</span>
        <span class="slider__tick">85°</span>
      </div>
    </div>

    <!-- Storage Usage -->
    <div class="slider slider--danger">
      <div class="slider__header">
        <label class="slider__label">Storage Used</label>
        <span class="slider__value">85 GB</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="85" data-suffix=" GB" disabled>
      <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">85 GB of 100 GB used</p>
    </div>
  </div>
</section>
