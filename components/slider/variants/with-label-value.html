<!-- Slider: With Label and Value -->
<div class="demo-showcase">
  <div class="slider" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Volume</label>
      <span class="slider__value">50%</span>
    </div>
    <input type="range" class="slider__input" min="0" max="100" value="50" data-suffix="%">
  </div>
</div>
