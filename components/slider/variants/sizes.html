<!-- Slider: Size Variants -->
<div class="demo-showcase">
  <div style="max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
    <div class="slider slider--sm">
      <div class="slider__header">
        <label class="slider__label">Small</label>
        <span class="slider__value">25</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="25">
    </div>

    <div class="slider">
      <div class="slider__header">
        <label class="slider__label">Default</label>
        <span class="slider__value">50</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="50">
    </div>

    <div class="slider slider--lg">
      <div class="slider__header">
        <label class="slider__label">Large</label>
        <span class="slider__value">75</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="75">
    </div>
  </div>
</div>
