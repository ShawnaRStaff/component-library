<!-- Slider: Color Variants -->
<div class="demo-showcase">
  <div style="max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
    <div class="slider">
      <div class="slider__header">
        <label class="slider__label">Primary</label>
        <span class="slider__value">60</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="60">
    </div>

    <div class="slider slider--success">
      <div class="slider__header">
        <label class="slider__label">Success</label>
        <span class="slider__value">80</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="80">
    </div>

    <div class="slider slider--warning">
      <div class="slider__header">
        <label class="slider__label">Warning</label>
        <span class="slider__value">40</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="40">
    </div>

    <div class="slider slider--danger">
      <div class="slider__header">
        <label class="slider__label">Danger</label>
        <span class="slider__value">20</span>
      </div>
      <input type="range" class="slider__input" min="0" max="100" value="20">
    </div>
  </div>
</div>
