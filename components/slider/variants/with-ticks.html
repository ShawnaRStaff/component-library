<!-- Slider: With Ticks/Steps -->
<div class="demo-showcase">
  <div class="slider" style="max-width: 400px;">
    <div class="slider__header">
      <label class="slider__label">Rating</label>
      <span class="slider__value">3</span>
    </div>
    <input type="range" class="slider__input" min="1" max="5" step="1" value="3">
    <div class="slider__ticks">
      <span class="slider__tick">1</span>
      <span class="slider__tick">2</span>
      <span class="slider__tick">3</span>
      <span class="slider__tick">4</span>
      <span class="slider__tick">5</span>
    </div>
  </div>
</div>
