<!-- Stack: Practical Example - Card with Stack -->
<div class="demo-showcase--full">
  <div style="max-width: 350px; background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: 12px; overflow: hidden;">
    <div style="height: 150px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700));"></div>
    <div class="stack stack--gap-3" style="padding: 20px;">
      <div class="hstack hstack--justify-between">
        <h4 style="margin: 0;">Product Name</h4>
        <span style="font-weight: 600; color: var(--color-primary-600);">$99</span>
      </div>
      <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">
        A short description of the product goes here.
      </p>
      <div class="hstack hstack--gap-2">
        <button class="btn btn--primary" style="flex: 1;">Add to Cart</button>
        <button class="btn btn--secondary btn--icon" aria-label="Add to favorites">&#9825;</button>
      </div>
    </div>
  </div>
</div>
