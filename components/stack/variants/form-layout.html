<!-- Stack: Practical Example - Form Layout -->
<div class="demo-showcase--full">
  <div class="stack stack--gap-4" style="max-width: 400px;">
    <div class="form-group">
      <label class="form-group__label">Email</label>
      <input type="email" class="input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-group__label">Password</label>
      <input type="password" class="input" placeholder="••••••••">
    </div>
    <div class="hstack hstack--justify-between">
      <label class="checkbox">
        <input type="checkbox" class="checkbox__input">
        <span class="checkbox__box"></span>
        <span class="checkbox__label">Remember me</span>
      </label>
      <a href="#" style="font-size: 14px; color: var(--color-primary-600);">Forgot password?</a>
    </div>
    <button class="btn btn--primary btn--block">Sign In</button>
  </div>
</div>
