<!-- Command Palette - Empty State Variant -->
<div class="demo-showcase">
  <button class="btn btn--outline" onclick="document.getElementById('demo-palette-3').classList.add('is-open')">
    Open Empty State
  </button>

  <div class="command-palette-overlay" id="demo-palette-3" onclick="if(event.target === this) this.classList.remove('is-open')">
    <div class="command-palette">
      <div class="command-palette__header">
        <svg class="command-palette__icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
        </svg>
        <input type="text" class="command-palette__input" placeholder="Search..." value="xyznotfound">
        <div class="command-palette__shortcut">
          <kbd class="kbd kbd--sm">Esc</kbd>
        </div>
      </div>

      <div class="command-palette__results">
        <div class="command-palette__empty">
          <svg class="command-palette__empty-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
          </svg>
          <div class="command-palette__empty-title">No results found</div>
          <div class="command-palette__empty-description">Try searching for something else</div>
        </div>
      </div>
    </div>
  </div>
</div>
