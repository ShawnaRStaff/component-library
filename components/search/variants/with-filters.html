<!-- Search: With Filters -->
<div class="demo-showcase">
  <div style="max-width: 500px;">
    <div class="search search--dropdown is-open">
      <svg class="search__icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
      </svg>
      <input type="search" class="search__input" placeholder="Search products..." value="laptop">
      <div class="search__dropdown">
        <div class="search__filters">
          <button class="search__filter is-active">All</button>
          <button class="search__filter">Electronics</button>
          <button class="search__filter">Clothing</button>
          <button class="search__filter">Books</button>
        </div>
        <div class="search__section">
          <ul class="search__results">
            <li>
              <a href="#" class="search__result">
                <img src="https://via.placeholder.com/40" alt="" style="width: 40px; height: 40px; border-radius: var(--radius-md); object-fit: cover;">
                <div class="search__result-content">
                  <div class="search__result-title">MacBook Pro 14"</div>
                  <div class="search__result-description">Apple M3 Pro, 18GB RAM, 512GB SSD</div>
                </div>
                <span class="search__result-meta">$1,999</span>
              </a>
            </li>
            <li>
              <a href="#" class="search__result">
                <img src="https://via.placeholder.com/40" alt="" style="width: 40px; height: 40px; border-radius: var(--radius-md); object-fit: cover;">
                <div class="search__result-content">
                  <div class="search__result-title">Dell XPS 15</div>
                  <div class="search__result-description">Intel i7, 16GB RAM, 1TB SSD</div>
                </div>
                <span class="search__result-meta">$1,499</span>
              </a>
            </li>
            <li>
              <a href="#" class="search__result">
                <img src="https://via.placeholder.com/40" alt="" style="width: 40px; height: 40px; border-radius: var(--radius-md); object-fit: cover;">
                <div class="search__result-content">
                  <div class="search__result-title">ThinkPad X1 Carbon</div>
                  <div class="search__result-description">Intel i7, 32GB RAM, 1TB SSD</div>
                </div>
                <span class="search__result-meta">$1,799</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
