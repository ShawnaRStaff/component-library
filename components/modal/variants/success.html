<!-- Modal: Success -->
<div class="demo-showcase">
  <button class="btn btn--success" data-modal-trigger="modal-success-variant">Show Success</button>

  <div class="modal modal--sm modal--centered" id="modal-success-variant" aria-hidden="true">
    <div class="modal__backdrop"></div>
    <div class="modal__container">
      <div class="modal__content">
        <div class="modal__body" style="padding-top: var(--space-8);">
          <div class="modal__icon modal__icon--success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <h3 style="margin-bottom: var(--space-2); color: var(--text-primary);">Success!</h3>
          <p>Your changes have been saved successfully.</p>
        </div>
        <footer class="modal__footer">
          <button class="btn btn--primary" data-modal-close>Continue</button>
        </footer>
      </div>
    </div>
  </div>
</div>
