<div class="demo-showcase">
  <div style="position: relative; height: 300px; background: var(--bg-secondary); border-radius: var(--radius-lg); overflow: hidden;">
    <!-- Top Left -->
    <div style="position: absolute; top: 12px; left: 12px;">
      <div class="toast toast--compact toast--dark" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Top Left</span>
      </div>
    </div>

    <!-- Top Center -->
    <div style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%);">
      <div class="toast toast--compact toast--dark" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Top Center</span>
      </div>
    </div>

    <!-- Top Right -->
    <div style="position: absolute; top: 12px; right: 12px;">
      <div class="toast toast--compact toast--success" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Top Right (default)</span>
      </div>
    </div>

    <!-- Bottom Left -->
    <div style="position: absolute; bottom: 12px; left: 12px;">
      <div class="toast toast--compact toast--dark" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Bottom Left</span>
      </div>
    </div>

    <!-- Bottom Center -->
    <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);">
      <div class="toast toast--compact toast--dark" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Bottom Center</span>
      </div>
    </div>

    <!-- Bottom Right -->
    <div style="position: absolute; bottom: 12px; right: 12px;">
      <div class="toast toast--compact toast--dark" style="animation: none; min-width: auto; font-size: 11px; padding: 6px 10px;">
        <span>Bottom Right</span>
      </div>
    </div>
  </div>
</div>
