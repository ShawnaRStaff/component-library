<!-- Button Component Demo -->

<section class="demo-section">
  <h3>Variants</h3>
  <div class="demo-row">
    <button class="btn">Default</button>
    <button class="btn btn--primary">Primary</button>
    <button class="btn btn--secondary">Secondary</button>
    <button class="btn btn--danger">Danger</button>
    <button class="btn btn--ghost">Ghost</button>
  </div>
</section>

<section class="demo-section">
  <h3>Sizes</h3>
  <div class="demo-row">
    <button class="btn btn--primary btn--sm">Small</button>
    <button class="btn btn--primary">Medium</button>
    <button class="btn btn--primary btn--lg">Large</button>
  </div>
</section>

<section class="demo-section">
  <h3>States</h3>
  <div class="demo-row">
    <button class="btn btn--primary">Normal</button>
    <button class="btn btn--primary" disabled>Disabled</button>
    <button class="btn btn--primary btn--loading" data-demo-loading>Click for Loading</button>
  </div>
</section>

<section class="demo-section">
  <h3>Full Width</h3>
  <div class="demo-row" style="max-width: 400px;">
    <button class="btn btn--primary btn--block">Full Width Button</button>
  </div>
</section>

<section class="demo-section">
  <h3>With Icons</h3>
  <div class="demo-row">
    <button class="btn btn--primary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0a8 8 0 100 16A8 8 0 008 0zm1 11H7V7h2v4zm0-5H7V4h2v2z"/>
      </svg>
      With Icon
    </button>
    <button class="btn btn--secondary btn--icon" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1112 0A6 6 0 012 8z"/>
      </svg>
    </button>
  </div>
</section>

<section class="demo-section">
  <h3>Interactive Demo</h3>
  <div class="demo-row">
    <button class="btn" data-demo-toggle aria-pressed="false">Toggle Me</button>
    <button class="btn btn--primary" data-demo-loading>Click for Loading State</button>
  </div>
</section>
