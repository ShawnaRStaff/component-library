<!-- Empty State: Practical Examples -->
<div class="demo-showcase--full">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
    <!-- No Messages -->
    <div class="empty-state empty-state--bordered">
      <div class="empty-state__icon empty-state__icon--bg">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </div>
      <h3 class="empty-state__title">No messages</h3>
      <p class="empty-state__description">Your inbox is empty. Messages you receive will appear here.</p>
    </div>

    <!-- No Notifications -->
    <div class="empty-state empty-state--bordered">
      <div class="empty-state__icon empty-state__icon--bg">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
      </div>
      <h3 class="empty-state__title">All clear!</h3>
      <p class="empty-state__description">You have no notifications at the moment.</p>
    </div>

    <!-- No Team Members -->
    <div class="empty-state empty-state--bordered">
      <div class="empty-state__icon empty-state__icon--bg">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </div>
      <h3 class="empty-state__title">No team members</h3>
      <p class="empty-state__description">Invite people to collaborate on this project.</p>
      <div class="empty-state__actions">
        <button class="btn btn--primary btn--sm">Invite Members</button>
      </div>
    </div>

    <!-- No Comments -->
    <div class="empty-state empty-state--bordered">
      <div class="empty-state__icon empty-state__icon--bg">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/>
        </svg>
      </div>
      <h3 class="empty-state__title">No comments yet</h3>
      <p class="empty-state__description">Be the first to share your thoughts.</p>
      <div class="empty-state__actions">
        <button class="btn btn--secondary btn--sm">Add Comment</button>
      </div>
    </div>
  </div>
</div>
