<!-- Kbd: Mac-Style Keys -->
<div class="demo-showcase">
  <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
    <kbd class="kbd kbd--mac kbd--symbol">&#8984;</kbd>
    <kbd class="kbd kbd--mac kbd--symbol">&#8997;</kbd>
    <kbd class="kbd kbd--mac kbd--symbol">&#8963;</kbd>
    <kbd class="kbd kbd--mac kbd--symbol">&#8679;</kbd>
    <kbd class="kbd kbd--mac">fn</kbd>
    <kbd class="kbd kbd--mac">delete</kbd>
    <kbd class="kbd kbd--mac">return</kbd>
  </div>
  <div style="margin-top: 16px;">
    <div class="kbd-combo">
      <kbd class="kbd kbd--mac kbd--symbol">&#8984;</kbd>
      <span class="kbd-combo__separator">+</span>
      <kbd class="kbd kbd--mac">C</kbd>
      <span style="margin-left: 12px; color: var(--text-secondary); font-size: var(--font-size-sm);">Copy (Mac)</span>
    </div>
  </div>
</div>
