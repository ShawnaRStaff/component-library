<!-- Kbd: Inline Shortcut Hints -->
<div class="demo-showcase" style="display: flex; flex-direction: column; gap: 12px;">
  <div class="kbd-hint">
    <span class="kbd-hint__label">Save:</span>
    <kbd class="kbd kbd--sm">Ctrl</kbd>
    <kbd class="kbd kbd--sm">S</kbd>
  </div>
  <div class="kbd-hint">
    <span class="kbd-hint__label">Undo:</span>
    <kbd class="kbd kbd--sm">Ctrl</kbd>
    <kbd class="kbd kbd--sm">Z</kbd>
  </div>
  <div class="kbd-hint">
    <span class="kbd-hint__label">Search:</span>
    <kbd class="kbd kbd--sm">Ctrl</kbd>
    <kbd class="kbd kbd--sm">K</kbd>
  </div>
</div>
