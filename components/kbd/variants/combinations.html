<!-- Kbd: Key Combinations -->
<div class="demo-showcase" style="display: flex; flex-direction: column; gap: 16px;">
  <div class="kbd-combo">
    <kbd class="kbd">Ctrl</kbd>
    <span class="kbd-combo__separator">+</span>
    <kbd class="kbd">C</kbd>
    <span style="margin-left: 12px; color: var(--text-secondary); font-size: var(--font-size-sm);">Copy</span>
  </div>
  <div class="kbd-combo">
    <kbd class="kbd">Ctrl</kbd>
    <span class="kbd-combo__separator">+</span>
    <kbd class="kbd">V</kbd>
    <span style="margin-left: 12px; color: var(--text-secondary); font-size: var(--font-size-sm);">Paste</span>
  </div>
  <div class="kbd-combo">
    <kbd class="kbd">Ctrl</kbd>
    <span class="kbd-combo__separator">+</span>
    <kbd class="kbd">Shift</kbd>
    <span class="kbd-combo__separator">+</span>
    <kbd class="kbd">P</kbd>
    <span style="margin-left: 12px; color: var(--text-secondary); font-size: var(--font-size-sm);">Command Palette</span>
  </div>
  <div class="kbd-combo">
    <kbd class="kbd">Alt</kbd>
    <span class="kbd-combo__separator">+</span>
    <kbd class="kbd">Tab</kbd>
    <span style="margin-left: 12px; color: var(--text-secondary); font-size: var(--font-size-sm);">Switch Window</span>
  </div>
</div>
