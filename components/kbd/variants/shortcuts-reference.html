<!-- Kbd: Common Shortcuts Reference -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">New File</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">N</kbd>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">Open File</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">O</kbd>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">Save</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">S</kbd>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">Find</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">F</kbd>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">Replace</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">H</kbd>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md);">
      <span style="font-size: var(--font-size-sm);">Go to Line</span>
      <div class="kbd-row">
        <kbd class="kbd kbd--sm">Ctrl</kbd>
        <kbd class="kbd kbd--sm">G</kbd>
      </div>
    </div>
  </div>
</div>
