<!-- Stat: With Progress Bar -->
<div class="demo-showcase">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; max-width: 700px;">
    <div class="stat-card">
      <div class="stat__label">Storage Used</div>
      <div class="stat__value">7.2 GB</div>
      <div class="stat__description">of 10 GB</div>
      <div class="stat__progress">
        <div class="stat__progress-bar">
          <div class="stat__progress-fill" style="width: 72%;"></div>
        </div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat__label">Goal Progress</div>
      <div class="stat__value">89%</div>
      <div class="stat__description">$8,900 of $10,000</div>
      <div class="stat__progress">
        <div class="stat__progress-bar">
          <div class="stat__progress-fill stat__progress-fill--success" style="width: 89%;"></div>
        </div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat__label">API Quota</div>
      <div class="stat__value">95%</div>
      <div class="stat__description">Nearly exceeded</div>
      <div class="stat__progress">
        <div class="stat__progress-bar">
          <div class="stat__progress-fill stat__progress-fill--danger" style="width: 95%;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
