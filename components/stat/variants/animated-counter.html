<!-- Stat: Animated Counter -->
<div class="demo-showcase">
  <div style="display: flex; gap: 48px; flex-wrap: wrap;">
    <div class="stat">
      <div class="stat__label">Total Sales</div>
      <div class="stat__value" data-stat-animate="12345" data-stat-prefix="$" data-stat-duration="2000">$0</div>
    </div>
    <div class="stat">
      <div class="stat__label">Customers</div>
      <div class="stat__value" data-stat-animate="8432" data-stat-duration="1500">0</div>
    </div>
    <div class="stat">
      <div class="stat__label">Conversion Rate</div>
      <div class="stat__value" data-stat-animate="4.28" data-stat-suffix="%" data-stat-duration="1000">0%</div>
    </div>
  </div>
  <p style="margin-top: 12px; font-size: 12px; color: var(--text-secondary);">Numbers animate when scrolled into view</p>
</div>
