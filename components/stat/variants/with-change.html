<!-- Stat: With Change Indicator -->
<div class="demo-showcase">

    <div class="stat">
      <div class="stat__label">Users</div>
      <div class="stat__value">12,345</div>
      <div class="stat__change stat__change--up">
        <svg class="stat__change-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z"/>

      <div class="stat__label">Bounce Rate</div>
      <div class="stat__value">42.3%</div>
      <div class="stat__change stat__change--down">
        <svg class="stat__change-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M14.707 10.293a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 12.586V5a1 1 0 012 0v7.586l2.293-2.293a1 1 0 011.414 0z"/>

    </div>

    <div class="stat">
      <div class="stat__label">Sessions</div>
      <div class="stat__value">8,420</div>
      <div class="stat__change stat__change--neutral">
        No change
      </div>
    </div>
  </div>
</div>
