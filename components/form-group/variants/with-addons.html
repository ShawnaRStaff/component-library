<!-- Form Group: Input with Addons -->
<div class="demo-showcase--full">
  <div style="max-width: 400px;">
    <div class="form-group">
      <label class="form-group__label">Website</label>
      <div class="form-group__input-group">
        <span class="form-group__addon form-group__addon--start">https://</span>
        <input class="input" type="text" placeholder="example.com">
      </div>
    </div>

    <div class="form-group">
      <label class="form-group__label">Price</label>
      <div class="form-group__input-group">
        <span class="form-group__addon form-group__addon--start">$</span>
        <input class="input" type="number" placeholder="0.00">
        <span class="form-group__addon form-group__addon--end">USD</span>
      </div>
    </div>
  </div>
</div>
