<!-- Form Group: Form Row (Multiple Fields) -->
<div class="demo-showcase--full">
  <div style="max-width: 600px;">
    <div class="form-row form-row--2">
      <div class="form-group">
        <label class="form-group__label">First Name</label>
        <input class="input" type="text" placeholder="John">
      </div>
      <div class="form-group">
        <label class="form-group__label">Last Name</label>
        <input class="input" type="text" placeholder="Doe">
      </div>
    </div>

    <div class="form-row form-row--3" style="margin-top: 16px;">
      <div class="form-group">
        <label class="form-group__label">City</label>
        <input class="input" type="text" placeholder="New York">
      </div>
      <div class="form-group">
        <label class="form-group__label">State</label>
        <select class="select">
          <option>Select...</option>
          <option>California</option>
          <option>New York</option>
          <option>Texas</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-group__label">ZIP</label>
        <input class="input" type="text" placeholder="10001">
      </div>
    </div>
  </div>
</div>
