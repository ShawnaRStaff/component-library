<!-- Form Group: Horizontal Layout -->
<div class="demo-showcase--full">
  <div style="max-width: 600px;">
    <div class="form-group form-group--horizontal">
      <label class="form-group__label form-group__label--required">Email</label>
      <div class="form-group__content">
        <input class="input" type="email" placeholder="you@example.com">
        <span class="form-group__helper">Your primary email address.</span>
      </div>
    </div>
    <div class="form-group form-group--horizontal">
      <label class="form-group__label">Notification</label>
      <div class="form-group__content">
        <label class="checkbox">
          <input type="checkbox" class="checkbox__input">
          <span class="checkbox__box"></span>
          <span class="checkbox__label">Send me marketing emails</span>
        </label>
      </div>
    </div>
  </div>
</div>
