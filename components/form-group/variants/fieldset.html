<!-- Form Group: Fieldset -->
<div class="demo-showcase--full">
  <div style="max-width: 500px;">
    <fieldset class="fieldset">
      <legend class="fieldset__legend">Personal Information</legend>
      <p class="fieldset__description">Please provide your personal details below.</p>

      <div class="form-group">
        <label class="form-group__label form-group__label--required">Full Name</label>
        <input class="input" type="text" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label class="form-group__label form-group__label--required">Email</label>
        <input class="input" type="email" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label class="form-group__label">Date of Birth</label>
        <input class="input" type="date">
      </div>
    </fieldset>
  </div>
</div>
