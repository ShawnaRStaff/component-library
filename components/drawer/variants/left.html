<!-- Left Drawer Variant -->
<div class="demo-showcase--full">
  <button class="btn btn--secondary" data-drawer-trigger="drawer-left">Open Left Drawer</button>

  <div class="drawer-overlay" data-drawer-overlay="drawer-left"></div>

    <div class="drawer__header">
      <h3 class="drawer__title">Navigation</h3>
      <button class="drawer__close" data-drawer-close aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">

        </svg>
      </button>
    </div>
    <div class="drawer__body">
      <nav style="display: flex; flex-direction: column; gap: 4px;">
        <a href="#" style="display: block; padding: 12px 16px; border-radius: 8px; color: var(--text-primary); text-decoration: none; background: var(--color-primary-50);">Dashboard</a>
        <a href="#" style="display: block; padding: 12px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none;">Projects</a>
        <a href="#" style="display: block; padding: 12px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none;">Team</a>
        <a href="#" style="display: block; padding: 12px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none;">Settings</a>
      </nav>
    </div>
  </div>
</div>
