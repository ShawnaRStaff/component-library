<!-- Drawer with Form Variant -->
<div class="demo-showcase">
  <button class="btn btn--primary" data-drawer-trigger="drawer-form">Edit Profile</button>

  <div class="drawer-overlay" data-drawer-overlay="drawer-form"></div>
  <div class="drawer" id="drawer-form">
    <div class="drawer__header">
      <h3 class="drawer__title">Edit Profile</h3>
      <button class="drawer__close" data-drawer-close aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
        </svg>
      </button>
    </div>
    <div class="drawer__body">
      <form style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label class="form-group__label">Full Name</label>
          <input type="text" class="input" value="John Doe">
        </div>
        <div class="form-group">
          <label class="form-group__label">Email</label>
          <input type="email" class="input" value="john@example.com">
        </div>
        <div class="form-group">
          <label class="form-group__label">Bio</label>
          <textarea class="input" rows="3" placeholder="Tell us about yourself..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-group__label">Notifications</label>
          <div class="checkbox-group">
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" checked>
              <span class="checkbox__box"></span>
              <span class="checkbox__label">Email notifications</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input">
              <span class="checkbox__box"></span>
              <span class="checkbox__label">SMS notifications</span>
            </label>
          </div>
        </div>
      </form>
    </div>
    <div class="drawer__footer">
      <button class="btn btn--secondary" data-drawer-close>Cancel</button>
      <button class="btn btn--primary">Save Changes</button>
    </div>
  </div>
</div>
