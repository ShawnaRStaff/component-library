<!-- Right Drawer Variant -->
<div class="demo-showcase--full">
  <button class="btn btn--primary" data-drawer-trigger="drawer-right">Open Right Drawer</button>

  <div class="drawer-overlay" data-drawer-overlay="drawer-right"></div>
  <div class="drawer drawer--right" id="drawer-right">
    <div class="drawer__header">
      <h3 class="drawer__title">Right Drawer</h3>
      <button class="drawer__close" data-drawer-close aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
        </svg>
      </button>
    </div>
    <div class="drawer__body">
      <p>This is a right-side drawer. It slides in from the right edge of the screen.</p>
      <p style="margin-top: 16px;">Click the overlay or press Escape to close.</p>
    </div>
    <div class="drawer__footer">
      <button class="btn btn--secondary" data-drawer-close>Cancel</button>
      <button class="btn btn--primary">Save Changes</button>
    </div>
  </div>
</div>
